[project]
name = "candid-backend"
version = "0.1.0"
description = "ROCm/CUDA GPU-Enabled SaaS Hiring Intelligence Engine Backend"
readme = "README.md"
requires-python = ">=3.10"
packages = ["backend"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "torch>=2.3.0",
    "sentence-transformers>=3.0.1",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.4"
]

[tool.uv]
dev-dependencies = []
